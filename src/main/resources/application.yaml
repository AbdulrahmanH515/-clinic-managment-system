server:
  port: 8081

spring:
  application:
    name: clinc_system_management
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  datasource:
    url: jdbc:h2:mem:clinicdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console