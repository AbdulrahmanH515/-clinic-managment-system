server:
  port: 8080

spring:
  application:
    name: clinc_system_management
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  datasource:
    url: jdbc:h2:mem:clinicdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: "3f8a1c9e6b2d4f7a0c5e8b1d4f7a0c3e6b9d2f5a8c1e4b7d0f3a6c9e2b5d8f1a"
